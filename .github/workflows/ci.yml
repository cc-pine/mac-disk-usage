name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
        env:
          # 起動ディスクの範囲・パッケージ判定・実際のゴミ箱移動を確かめる結合テストを有効にする
          MDU_INTEGRATION: "1"
      - name: Benchmark (1M synthetic files)
        run: |
          set -o pipefail
          MDU_BENCHMARK=1 swift test -c release --filter BenchmarkTests 2>&1 | grep -E "benchmark|error|passed|failed"
      - name: Build app bundle
        run: scripts/make-app.sh

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tools-version の下限と、ローカル開発で使う版の両方で確認する
        swift: ["6.0", "6.3"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
